<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIN FARM — Dashboards</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #07130D;
    color: #EEF8F1;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 850px;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #94AD9D;
    margin-bottom: 40px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.card {
    background: #10261A;
    border: 1px solid #1E4430;
    border-radius: 12px;
    padding: 30px 20px;
}

.card h2 {
    margin-top: 0;
}

.card p {
    color: #94AD9D;
    font-size: 14px;
    min-height: 40px;
}

.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 11px 20px;
    border-radius: 7px;
    background: #19B86B;
    color: #03110F;
    text-decoration: none;
    font-weight: bold;
}

.btn:hover {
    opacity: 0.85;
}

.footer {
    margin-top: 35px;
    color: #627D6C;
    font-size: 12px;
}

@media(max-width:650px) {
    .cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>DIN FARM — DASHBOARDS</h1>

    <div class="subtitle">
        BESS & Energy Monitoring System
    </div>

    <div class="cards">

        <div class="card">
            <h2>🔋 BESS Operations</h2>
            <p>
                BESS operation, power flow, SOC,
                grid availability and performance.
            </p>

            <a class="btn" href="BESS-Dashboard-DinFarm.html">
                Open Dashboard
            </a>
        </div>

        <div class="card">
            <h2>📋 BESS Daily Logs</h2>
            <p>
                Detailed readings, grid status,
                BESS, solar, load and remarks.
            </p>

            <a class="btn" href="DIN-Farm-Logs.html">
                Open Daily Logs
            </a>
        </div>

    </div>

    <div class="footer">
        DIN FARM · DSG Energy
    </div>

</div>

</body>
</html>
